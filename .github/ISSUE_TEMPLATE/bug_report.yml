name: "Bug report"
description: "Report a reproducible problem"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please fill out the sections below to help us investigate and resolve it quickly.

  - type: textarea
    id: summary
    attributes:
      label: "Bug Summary"
      description: "A clear and concise description of the bug."
      placeholder: "Describe what went wrong..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "e.g., Cart subtotal should update when quantity increases"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened instead?"
      placeholder: "e.g., Error modal displayed with code 500"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Software and operating system versions."
      value: |
        - OS: [e.g. Ubuntu 22.04 / macOS 14 / Windows 11]
        - Browser: [e.g. Chrome 124 / Firefox 125]
        - Node Version: [e.g. 20.12.0]
        - Python Version: [e.g. 3.12.2]
        - Database: [e.g. MongoDB 7.0]
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severely does this issue impact operation?"
      options:
        - "Low — Cosmetic or minor annoyance"
        - "Medium — Feature impaired but workaround available"
        - "High — Core workflow broken (e.g. checkout, login)"
        - "Critical — Service crash, data loss, or security issue"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Terminal / Console Logs"
      description: "Paste any relevant error output, stack traces, or network logs."
      render: shell
      placeholder: "Paste logs here..."

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Media"
      description: "Drag & drop images or animated recordings demonstrating the problem."

  - type: textarea
    id: context
    attributes:
      label: "Additional Context"
      description: "Any other details or context about the problem here."
