services:
  mongodb:
    image: mongo:7
    container_name: hch_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hch_backend
    ports:
      - "8015:8015"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DB_NAME=hamid_cloth_house
      - JWT_SECRET=dev-secret-change-in-production
      - FRONTEND_ORIGIN=http://localhost:5173
      - PORT=8015
      - DEBUG=true
    depends_on:
      - mongodb
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8015 --reload

volumes:
  mongodb_data:
